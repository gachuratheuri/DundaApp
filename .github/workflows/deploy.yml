name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy to
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME }}
      NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}

    steps:
      - name: Require successful CI for this exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=10" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")][0].conclusion // ""')"
          test "$conclusion" = "success" || {
            echo "::error::CI has not succeeded for immutable revision ${GITHUB_SHA}"
            exit 1
          }

      - name: Validate protected-environment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REGISTRY" || { echo "::error::CONTAINER_REGISTRY is required"; exit 1; }
          test -n "$IMAGE_NAME" || { echo "::error::CONTAINER_IMAGE_NAME is required"; exit 1; }
          test -n "$NAMESPACE" || { echo "::error::KUBERNETES_NAMESPACE is required"; exit 1; }
          test -n "${{ secrets.REGISTRY_USERNAME }}" || { echo "::error::REGISTRY_USERNAME is required"; exit 1; }
          test -n "${{ secrets.REGISTRY_PASSWORD }}" || { echo "::error::REGISTRY_PASSWORD is required"; exit 1; }
          test -n "${{ secrets.KUBECONFIG_B64 }}" || { echo "::error::KUBECONFIG_B64 is required"; exit 1; }

      - name: Checkout immutable source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish commit-addressed image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Configure Kubernetes credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kube"
          echo '${{ secrets.KUBECONFIG_B64 }}' | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Scan published image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign immutable image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Render immutable deployment manifest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${IMAGE_DIGEST#sha256:}"
          sed \
            -e "s|namespace: default|namespace: ${NAMESPACE}|g" \
            -e "s|dundaregistry.azurecr.io/dunda-api@sha256:REPLACE_WITH_SIGNED_DIGEST|${REGISTRY}/${IMAGE_NAME}@sha256:${digest}|" \
            infra/k8s/deployment.yaml > "$RUNNER_TEMP/deployment.yaml"
          revision="${GITHUB_SHA:0:12}"
          sed \
            -e "s|namespace: default|namespace: ${NAMESPACE}|g" \
            -e "s|REPLACE_WITH_REVISION|${revision}|g" \
            -e "s|dundaregistry.azurecr.io/dunda-api@sha256:REPLACE_WITH_SIGNED_DIGEST|${REGISTRY}/${IMAGE_NAME}@sha256:${digest}|" \
            infra/k8s/migration-job.yaml > "$RUNNER_TEMP/migration-job.yaml"

      - name: Run additive database migrations
        shell: bash
        run: |
          set -euo pipefail
          revision="${GITHUB_SHA:0:12}"
          kubectl apply -f "$RUNNER_TEMP/migration-job.yaml"
          if ! kubectl -n "$NAMESPACE" wait \
            --for=condition=complete "job/dunda-migrate-${revision}" --timeout=15m; then
            kubectl -n "$NAMESPACE" logs "job/dunda-migrate-${revision}" --all-containers=true
            exit 1
          fi

      - name: Apply manifests and verify rollout
        shell: bash
        run: |
          set -euo pipefail
          for manifest in infra/k8s/service.yaml infra/k8s/networkpolicy.yaml infra/k8s/dunda-api-hpa.yaml; do
            sed "s|namespace: default|namespace: ${NAMESPACE}|g" "$manifest" | kubectl apply -f -
          done
          kubectl apply -f "$RUNNER_TEMP/deployment.yaml"
          kubectl -n "$NAMESPACE" rollout status deployment/dunda-api --timeout=10m
