# redis.conf — Critical settings for Dunda escrow integrity
maxmemory-policy noeviction          # NEVER evict keys; reject new writes instead
maxmemory 3gb                        # Bound memory so noeviction has a defined trigger; size per workload
save ""                               # Disable RDB snapshots for performance (AOF handles persistence)
appendonly yes                        # AOF persistence for escrow durability across restarts
appendfsync everysec                  # Balance durability and performance
notify-keyspace-events Ex             # Enable expiry keyspace notifications (fast path only)
cluster-enabled yes                   # Clustered deployment (Redlock uses N independent masters)

# ── Connection hygiene ────────────────────────────────────────────────────────
timeout 0                             # Never close idle client connections (persistent Redix pool)
tcp-keepalive 60                      # Detect dead peers without app-level pings

# ── Operational safety ────────────────────────────────────────────────────────
# Authentication is injected at runtime; do NOT commit a password here.
# Provide it via `--requirepass "$REDIS_PASSWORD"` or a mounted secret.
lazyfree-lazy-expire yes              # Reclaim expired keys off the main thread
lazyfree-lazy-server-del yes
# Disable destructive/unbounded commands in production.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
