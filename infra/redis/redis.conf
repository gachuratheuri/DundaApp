# redis.conf — Dunda Redis projection/cache profile
# PostgreSQL is the business authority. Projection keys are disposable with TTLs.
# Security controls such as rate limits must not disappear under memory
# pressure. Reject writes and alert before exhaustion; projection/cache callers
# degrade explicitly and PostgreSQL remains authoritative.
maxmemory-policy noeviction
maxmemory 3gb                        # Bound disposable cache memory; size per workload
save ""
appendonly no
notify-keyspace-events Ex             # Expiry notifications are an acceleration only
# Redis Cluster is not required for the projection profile. If a transactional
# legacy mode is explicitly approved, it must use a cluster-aware client and
# hash-tag every Lua key; production defaults to PostgreSQL authority.
cluster-enabled no

# ── Connection hygiene ────────────────────────────────────────────────────────
timeout 0                             # Never close idle client connections (persistent Redix pool)
tcp-keepalive 60                      # Detect dead peers without app-level pings

# ── Operational safety ────────────────────────────────────────────────────────
# Authentication and TLS are injected by the managed Redis service/secret;
# do NOT commit credentials here. Disable public access and require TLS in the
# service topology. A local standalone instance is for tests only.
lazyfree-lazy-expire yes              # Reclaim expired keys off the main thread
lazyfree-lazy-server-del yes
# Disable destructive/unbounded commands in production.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
