apiVersion: apps/v1
kind: Deployment
metadata:
  name: dunda-api
  namespace: default
  labels:
    app: dunda-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dunda-api
  template:
    metadata:
      labels:
        app: dunda-api
    spec:
      containers:
      - name: dunda-api
        image: dundaregistry.azurecr.io/dunda-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        - containerPort: 4369
          name: epmd
        envFrom:
        - configMapRef:
            name: dunda-config
        - secretRef:
            name: dunda-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
