apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dunda-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dunda-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  # The metrics adapter must publish Oban queue depth/latency. CPU and memory
  # remain fallback signals, never the sole worker-saturation control.
  - type: External
    external:
      metric:
        name: oban_queue_depth
        selector:
          matchLabels:
            app: dunda-api
      target:
        type: AverageValue
        averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 10
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
